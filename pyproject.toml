[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "elastograde-research"
version = "0.1.0"
description = "Reproducible ultrasound mechanics and probabilistic research workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2", "PyYAML>=6,<7", "torch>=2.4,<3", "typer>=0.12,<1", "rich>=13,<16", "h5py>=3.10,<4"]
[project.optional-dependencies]
notebooks = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
tui = ["textual>=1,<9"]
dev = ["pytest>=8,<10"]
[project.scripts]
elastograde = "elastograde.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
